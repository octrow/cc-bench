name: sdd-kit
tier: f
hypothesis: The whole sdd-kit process (repo install, seeded AGENTS.md, seeded specs) raises accepted-task value per dollar spent over any single component alone.
primary_metric: usd_per_accepted_task
install:
  - kind: repo_artifacts
    src: sdd-kit/install.sh
    text: >
      Run `sdd-kit/install.sh --repo-only <clone>` against the target repo
      (bootstrap.sh is a deprecated shim for the same thing), seed a curated
      AGENTS.md plus openspec/specs/*, then commit the resulting tree
      to bench-base so every run starts from the same kit-installed state.
fired_check:
  kind: make_check
  # Gates as of sdd-kit 2026-08: AGENTS.md present and <=500 lines, `openspec
  # validate --all --strict` (needs npx + network), sdd-flags. spec-lint is
  # advisory (exit 0) unless SPEC_LINT_STRICT=1, so it cannot fail this check.
  command: make sdd-check
setup_cost_tracked: true
