[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-bench"
version = "0.0.1"
description = "Before/after benchmark harness for Claude Code tool ablation"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
bench = "cc_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_bench"]
